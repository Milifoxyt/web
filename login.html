<body data-page="auth">

<header class="topbar" id="top">
  <a class="brand" href="index.html">milifo<span aria-hidden="true">.</span></a>
  <nav class="nav" aria-label="主导航">
        <a href="works.html">作品</a>

  </div>
</header>

<main id="main">

<section class="section section--narrow">
    <div class="section__head">
      <p class="label">登录 / SIGN IN</p>
      <h1 class="section__title">欢迎回来</h1>
      <p class="section__note">登录后可以留言、投稿。</p>
    </div>
    <form class="form" data-auth-form="login">
      <label class="field"><span class="field__label">邮箱</span>
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
      <label class="field"><span class="field__label">密码</span>
        <input type="password" name="password" minlength="8" required autocomplete="current-password" placeholder="至少 8 位"></label>
      <span class="flash" data-flash hidden></span>
      <div class="form__actions"><button class="btn" type="submit">登录</button></div>
    </form>
    <p class="form__alt">还没有账号？<a href="register.html">注册一个</a></p>
  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <p>© <span data-year>2026</span> milifo · 读书，写字，找一个靠窗的位置</p>
    <p class="footer__meta">EdgeOne Pages · Functions + Blob</p>
  </div>
</footer>

<script src="assets/app.js" defer></script>
