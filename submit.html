<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿 · milifo</title>
<meta name="description" content="写一篇，或者投一篇">
<meta name="theme-color" content="#0b0908">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/blog.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="submit">
<a class="skip" href="#main">跳到正文</a>

<header class="topbar" id="top">
  <a class="brand" href="index.html">milifo<span aria-hidden="true">.</span></a>
  <nav class="nav" aria-label="主导航">
        <a href="works.html">作品</a>
        <a href="index.html#about">关于</a>
        <a href="index.html#places">阅读地点</a>
        <a href="works.html?kind=community">社区投稿</a>
        <a href="index.html#contact">联系</a>
  </nav>
  <div class="topbar__account">
        <a class="topbar__link" href="login.html">登录</a>
        <a class="topbar__cta" href="register.html">注册</a>
  </div>
</header>

<main id="main">

<section class="section section--head">
    <p class="label">投稿 / SUBMIT</p>
    <h1 class="section__title" data-submit-title>投一篇过来</h1>
    <p class="section__note" data-submit-note>原创作品归 milifo；别人投的稿会进「社区投稿」，我审核之后才公开。</p>

    <form class="form" data-post-form style="margin-top:32px;max-width:720px">
      <label class="field"><span class="field__label">标题</span>
        <input type="text" name="title" required maxlength="80" placeholder="比如：街角咖啡的下午"></label>
      <label class="field"><span class="field__label">摘要</span>
        <input type="text" name="excerpt" maxlength="120" placeholder="一句话说清这篇写了什么"></label>
      <label class="field"><span class="field__label">正文</span>
        <textarea name="body" rows="12" required placeholder="支持 ## 小标题、> 引用、- 列表、**粗体**"></textarea></label>
      <div class="field" data-cover-field>
        <span class="field__label">封面图（可选，5MB 以内）</span>
        <div class="uploader" data-uploader>
          <input type="file" accept="image/*" data-uploader-file hidden>
          <button class="btn btn--ghost btn--small" type="button" data-uploader-pick>选一张图</button>
          <span class="uploader__hint" data-uploader-hint>jpg / png / webp / gif</span>
          <img class="uploader__preview" data-uploader-preview alt="" hidden>
          <input type="hidden" name="cover" data-uploader-value>
        </div>
      </div>
      <span class="flash" data-flash hidden></span>
      <div class="form__actions"><button class="btn" type="submit">保存</button></div>
    </form>
  </section>
</main>

<footer class="footer">
  <div class="footer__inner">
    <p>© <span data-year>2026</span> milifo · 读书，写字，找一个靠窗的位置</p>
    <p class="footer__meta">EdgeOne Pages · Functions + Blob</p>
  </div>
</footer>

<script src="assets/app.js" defer></script>
<script src="assets/app-api.js" defer></script>
</body>
</html>
